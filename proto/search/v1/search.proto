syntax = "proto3";

package search.v1;

option go_package = "github.com/0xsj/nexus/api/search/v1;searchv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Search service handles search and discovery
service SearchService {
  // Global search (all content types)
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/v1/search"
    };
  }
  
  // Search users
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = {
      get: "/v1/search/users"
    };
  }
  
  // Search posts
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse) {
    option (google.api.http) = {
      get: "/v1/search/posts"
    };
  }
  
  // Search hashtags
  rpc SearchHashtags(SearchHashtagsRequest) returns (SearchHashtagsResponse) {
    option (google.api.http) = {
      get: "/v1/search/hashtags"
    };
  }
  
  // Get search suggestions (autocomplete)
  rpc GetSuggestions(GetSuggestionsRequest) returns (GetSuggestionsResponse) {
    option (google.api.http) = {
      get: "/v1/search/suggestions"
    };
  }
  
  // Get trending searches
  rpc GetTrendingSearches(GetTrendingSearchesRequest) returns (GetTrendingSearchesResponse) {
    option (google.api.http) = {
      get: "/v1/search/trending"
    };
  }
  
  // Get trending hashtags
  rpc GetTrendingHashtags(GetTrendingHashtagsRequest) returns (GetTrendingHashtagsResponse) {
    option (google.api.http) = {
      get: "/v1/search/trending/hashtags"
    };
  }
  
  // Save a search query (search history)
  rpc SaveSearch(SaveSearchRequest) returns (SaveSearchResponse) {
    option (google.api.http) = {
      post: "/v1/search/history"
      body: "*"
    };
  }
  
  // Get search history
  rpc GetSearchHistory(GetSearchHistoryRequest) returns (GetSearchHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/search/history"
    };
  }
  
  // Clear search history
  rpc ClearSearchHistory(ClearSearchHistoryRequest) returns (ClearSearchHistoryResponse) {
    option (google.api.http) = {
      delete: "/v1/search/history"
    };
  }
  
  // Delete a search from history
  rpc DeleteSearchFromHistory(DeleteSearchFromHistoryRequest) returns (DeleteSearchFromHistoryResponse) {
    option (google.api.http) = {
      delete: "/v1/search/history/{search_id}"
    };
  }
}

// Search type filter
enum SearchType {
  SEARCH_TYPE_UNSPECIFIED = 0;
  SEARCH_TYPE_ALL = 1;
  SEARCH_TYPE_USERS = 2;
  SEARCH_TYPE_POSTS = 3;
  SEARCH_TYPE_HASHTAGS = 4;
}

// Sort by
enum SearchSortBy {
  SEARCH_SORT_BY_UNSPECIFIED = 0;
  SEARCH_SORT_BY_RELEVANCE = 1;
  SEARCH_SORT_BY_RECENT = 2;
  SEARCH_SORT_BY_POPULAR = 3;
}

// Search result type
enum ResultType {
  RESULT_TYPE_UNSPECIFIED = 0;
  RESULT_TYPE_USER = 1;
  RESULT_TYPE_POST = 2;
  RESULT_TYPE_HASHTAG = 3;
}

// User search result
message UserResult {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  optional string bio = 5;
  bool is_verified = 6;
  int32 followers_count = 7;
  bool is_following = 8;
  double relevance_score = 9;
}

// Post search result
message PostResult {
  string post_id = 1;
  string user_id = 2;
  string content = 3;
  string author_username = 4;
  string author_avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 likes_count = 7;
  int32 comments_count = 8;
  repeated string tags = 9;
  double relevance_score = 10;
}

// Hashtag search result
message HashtagResult {
  string hashtag = 1; // Without '#' prefix
  int32 post_count = 2;
  int32 trending_score = 3;
  optional string description = 4;
  double relevance_score = 5;
}

// Generic search result
message SearchResult {
  ResultType type = 1;
  oneof result {
    UserResult user = 2;
    PostResult post = 3;
    HashtagResult hashtag = 4;
  }
  double relevance_score = 5;
}

// Search suggestion
message SearchSuggestion {
  string query = 1;
  SearchType type = 2;
  optional string icon = 3; // Icon hint (user, hashtag, etc.)
  optional int32 result_count = 4;
}

// Search history item
message SearchHistoryItem {
  string id = 1;
  string query = 2;
  SearchType type = 3;
  google.protobuf.Timestamp searched_at = 4;
  int32 result_count = 5;
}

// Trending search
message TrendingSearch {
  string query = 1;
  int32 search_count = 2;
  double trending_score = 3;
  string category = 4; // "news", "sports", "entertainment", etc.
}

// Trending hashtag
message TrendingHashtag {
  string hashtag = 1;
  int32 post_count = 2;
  int32 engagement_count = 3;
  double trending_score = 4;
  optional string description = 5;
}

// Search filters
message SearchFilters {
  optional common.v1.TimeRange date_range = 1;
  repeated string tags = 2;
  optional bool verified_only = 3; // For user searches
  optional int32 min_followers = 4; // For user searches
  optional string location = 5;
}

// Search
message SearchRequest {
  string query = 1;
  SearchType type = 2;
  common.v1.PaginationRequest pagination = 3;
  optional SearchSortBy sort_by = 4;
  optional SearchFilters filters = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_results = 3;
  string query = 4;
  double search_time_ms = 5; // How long the search took
  common.v1.ResponseMetadata metadata = 10;
}

// SearchUsers
message SearchUsersRequest {
  string query = 1;
  common.v1.PaginationRequest pagination = 2;
  optional SearchSortBy sort_by = 3;
  optional SearchFilters filters = 4;
}

message SearchUsersResponse {
  repeated UserResult users = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_results = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// SearchPosts
message SearchPostsRequest {
  string query = 1;
  common.v1.PaginationRequest pagination = 2;
  optional SearchSortBy sort_by = 3;
  optional SearchFilters filters = 4;
}

message SearchPostsResponse {
  repeated PostResult posts = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_results = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// SearchHashtags
message SearchHashtagsRequest {
  string query = 1;
  common.v1.PaginationRequest pagination = 2;
}

message SearchHashtagsResponse {
  repeated HashtagResult hashtags = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_results = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// GetSuggestions
message GetSuggestionsRequest {
  string query = 1;
  optional SearchType type = 2;
  optional int32 limit = 3; // Max suggestions to return (default 10)
}

message GetSuggestionsResponse {
  repeated SearchSuggestion suggestions = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetTrendingSearches
message GetTrendingSearchesRequest {
  optional int32 limit = 1; // Default 10
  optional string category = 2;
  optional string location = 3; // Location-based trends
}

message GetTrendingSearchesResponse {
  repeated TrendingSearch trending = 1;
  google.protobuf.Timestamp updated_at = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// GetTrendingHashtags
message GetTrendingHashtagsRequest {
  optional int32 limit = 1; // Default 10
  optional common.v1.TimeRange time_range = 2;
}

message GetTrendingHashtagsResponse {
  repeated TrendingHashtag trending = 1;
  google.protobuf.Timestamp updated_at = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// SaveSearch
message SaveSearchRequest {
  string query = 1;
  SearchType type = 2;
  int32 result_count = 3;
}

message SaveSearchResponse {
  SearchHistoryItem history_item = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetSearchHistory
message GetSearchHistoryRequest {
  common.v1.PaginationRequest pagination = 1;
  optional SearchType type = 2;
}

message GetSearchHistoryResponse {
  repeated SearchHistoryItem history = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// ClearSearchHistory
message ClearSearchHistoryRequest {
  // User identified from auth token
}

message ClearSearchHistoryResponse {
  bool success = 1;
  int32 deleted_count = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteSearchFromHistory
message DeleteSearchFromHistoryRequest {
  string search_id = 1;
}

message DeleteSearchFromHistoryResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}