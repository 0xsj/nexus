syntax = "proto3";

package media.v1;

option go_package = "github.com/0xsj/nexus/api/media/v1;mediav1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Media service handles file uploads and media management
service MediaService {
  // Request upload URL (for direct client-to-storage upload)
  rpc GetUploadURL(GetUploadURLRequest) returns (GetUploadURLResponse) {
    option (google.api.http) = {
      post: "/v1/media/upload-url"
      body: "*"
    };
  }
  
  // Confirm upload completion (after client uploads to storage)
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse) {
    option (google.api.http) = {
      post: "/v1/media/{media_id}/confirm"
      body: "*"
    };
  }
  
  // Upload media (small files via gRPC streaming)
  rpc UploadMedia(stream UploadChunk) returns (UploadMediaResponse);
  
  // Get media by ID
  rpc GetMedia(GetMediaRequest) returns (GetMediaResponse) {
    option (google.api.http) = {
      get: "/v1/media/{media_id}"
    };
  }
  
  // List user's media
  rpc ListMedia(ListMediaRequest) returns (ListMediaResponse) {
    option (google.api.http) = {
      get: "/v1/media"
    };
  }
  
  // Delete media
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse) {
    option (google.api.http) = {
      delete: "/v1/media/{media_id}"
    };
  }
  
  // Process media (generate thumbnails, optimize, etc.)
  rpc ProcessMedia(ProcessMediaRequest) returns (ProcessMediaResponse) {
    option (google.api.http) = {
      post: "/v1/media/{media_id}/process"
      body: "*"
    };
  }
  
  // Get media processing status
  rpc GetProcessingStatus(GetProcessingStatusRequest) returns (GetProcessingStatusResponse) {
    option (google.api.http) = {
      get: "/v1/media/{media_id}/status"
    };
  }
  
  // Stream upload progress (server streaming)
  rpc StreamUploadProgress(StreamUploadProgressRequest) returns (stream UploadProgressEvent) {
    option (google.api.http) = {
      get: "/v1/media/{media_id}/progress"
    };
  }
}

// Media type
enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_AUDIO = 3;
  MEDIA_TYPE_DOCUMENT = 4;
}

// Processing status
enum ProcessingStatus {
  PROCESSING_STATUS_UNSPECIFIED = 0;
  PROCESSING_STATUS_PENDING = 1;
  PROCESSING_STATUS_PROCESSING = 2;
  PROCESSING_STATUS_COMPLETED = 3;
  PROCESSING_STATUS_FAILED = 4;
}

// Upload method
enum UploadMethod {
  UPLOAD_METHOD_UNSPECIFIED = 0;
  UPLOAD_METHOD_DIRECT = 1;   // Direct to storage (S3, R2)
  UPLOAD_METHOD_STREAMING = 2; // Via gRPC stream
}

// Media resource
message Media {
  string id = 1;
  string user_id = 2;
  MediaType type = 3;
  string filename = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
  string url = 7;
  string thumbnail_url = 8;
  ProcessingStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  
  // Media metadata
  optional MediaMetadata metadata = 12;
  
  // Processing info
  optional ProcessingInfo processing = 13;
  
  // Storage info
  string storage_key = 14;
  string storage_bucket = 15;
}

// Media metadata
message MediaMetadata {
  // Image/Video dimensions
  optional int32 width = 1;
  optional int32 height = 2;
  
  // Video/Audio duration
  optional int32 duration_seconds = 3;
  
  // Bitrate (for video/audio)
  optional int32 bitrate = 4;
  
  // Format info
  optional string codec = 5;
  
  // EXIF data (for images)
  optional ExifData exif = 6;
  
  // File hash (for deduplication)
  optional string hash = 7;
}

// EXIF data
message ExifData {
  optional string camera_make = 1;
  optional string camera_model = 2;
  optional google.protobuf.Timestamp taken_at = 3;
  optional double latitude = 4;
  optional double longitude = 5;
  optional int32 iso = 6;
  optional string aperture = 7;
  optional string shutter_speed = 8;
}

// Processing info
message ProcessingInfo {
  ProcessingStatus status = 1;
  optional string error_message = 2;
  int32 progress_percentage = 3;
  google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp completed_at = 5;
  
  // Generated variants
  repeated MediaVariant variants = 6;
}

// Media variant (different sizes/formats)
message MediaVariant {
  string name = 1; // "thumbnail", "small", "medium", "large"
  string url = 2;
  int32 width = 3;
  int32 height = 4;
  int64 size_bytes = 5;
}

// Upload chunk (for streaming upload)
message UploadChunk {
  oneof data {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

// Upload metadata
message UploadMetadata {
  string filename = 1;
  string mime_type = 2;
  int64 total_size = 3;
  MediaType type = 4;
}

// Upload progress event
message UploadProgressEvent {
  string media_id = 1;
  int64 bytes_uploaded = 2;
  int64 total_bytes = 3;
  int32 progress_percentage = 4;
  ProcessingStatus status = 5;
  optional string error_message = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// GetUploadURL
message GetUploadURLRequest {
  string filename = 1;
  string mime_type = 2;
  int64 size_bytes = 3;
  MediaType type = 4;
}

message GetUploadURLResponse {
  string media_id = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3; // Headers to include in upload request
  google.protobuf.Timestamp expires_at = 4;
  common.v1.ResponseMetadata metadata = 10;
}

// ConfirmUpload
message ConfirmUploadRequest {
  string media_id = 1;
  optional string etag = 2; // S3 ETag for validation
}

message ConfirmUploadResponse {
  Media media = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UploadMedia (response for streaming upload)
message UploadMediaResponse {
  Media media = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetMedia
message GetMediaRequest {
  string media_id = 1;
}

message GetMediaResponse {
  Media media = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// ListMedia
message ListMediaRequest {
  common.v1.PaginationRequest pagination = 1;
  optional MediaType type = 2;
  optional ProcessingStatus status = 3;
  optional common.v1.TimeRange created_range = 4;
}

message ListMediaResponse {
  repeated Media media = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteMedia
message DeleteMediaRequest {
  string media_id = 1;
}

message DeleteMediaResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// ProcessMedia
message ProcessMediaRequest {
  string media_id = 1;
  repeated string variants = 2; // ["thumbnail", "small", "medium", "large"]
  optional bool generate_thumbnails = 3;
  optional bool optimize = 4;
}

message ProcessMediaResponse {
  bool success = 1;
  ProcessingInfo processing = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// GetProcessingStatus
message GetProcessingStatusRequest {
  string media_id = 1;
}

message GetProcessingStatusResponse {
  ProcessingInfo processing = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// StreamUploadProgress
message StreamUploadProgressRequest {
  string media_id = 1;
}