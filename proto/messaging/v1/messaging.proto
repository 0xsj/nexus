syntax = "proto3";

package messaging.v1;

option go_package = "github.com/0xsj/nexus/api/messaging/v1;messagingv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Messaging service handles chat and conversations
service MessagingService {
  // Create a new conversation
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse) {
    option (google.api.http) = {
      post: "/v1/conversations"
      body: "*"
    };
  }
  
  // Get conversation by ID
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}"
    };
  }
  
  // List conversations (paginated)
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = {
      get: "/v1/conversations"
    };
  }
  
  // Delete conversation
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse) {
    option (google.api.http) = {
      delete: "/v1/conversations/{conversation_id}"
    };
  }
  
  // Send a message
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/conversations/{conversation_id}/messages"
      body: "*"
    };
  }
  
  // Get message by ID
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}/messages/{message_id}"
    };
  }
  
  // List messages in a conversation (paginated)
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}/messages"
    };
  }
  
  // Delete a message
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {
    option (google.api.http) = {
      delete: "/v1/conversations/{conversation_id}/messages/{message_id}"
    };
  }
  
  // Mark messages as read
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse) {
    option (google.api.http) = {
      post: "/v1/conversations/{conversation_id}/read"
      body: "*"
    };
  }
  
  // Send typing indicator
  rpc SendTypingIndicator(SendTypingIndicatorRequest) returns (SendTypingIndicatorResponse) {
    option (google.api.http) = {
      post: "/v1/conversations/{conversation_id}/typing"
      body: "*"
    };
  }
  
  // Stream messages in a conversation (server streaming)
  rpc StreamMessages(StreamMessagesRequest) returns (stream MessageEvent) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}/stream"
    };
  }
  
  // Stream typing indicators (server streaming)
  rpc StreamTypingIndicators(StreamTypingIndicatorsRequest) returns (stream TypingIndicatorEvent) {
    option (google.api.http) = {
      get: "/v1/conversations/{conversation_id}/typing-stream"
    };
  }
  
  // Bidirectional chat stream (send and receive messages in real-time)
  rpc Chat(stream ChatRequest) returns (stream ChatResponse);
}

// Conversation type
enum ConversationType {
  CONVERSATION_TYPE_UNSPECIFIED = 0;
  CONVERSATION_TYPE_DIRECT = 1;  // 1-on-1
  CONVERSATION_TYPE_GROUP = 2;   // Group chat
}

// Message type
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_VIDEO = 3;
  MESSAGE_TYPE_AUDIO = 4;
  MESSAGE_TYPE_FILE = 5;
  MESSAGE_TYPE_LOCATION = 6;
  MESSAGE_TYPE_SYSTEM = 7; // System messages (e.g., "User joined")
}

// Message status
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_SENDING = 1;
  MESSAGE_STATUS_SENT = 2;
  MESSAGE_STATUS_DELIVERED = 3;
  MESSAGE_STATUS_READ = 4;
  MESSAGE_STATUS_FAILED = 5;
}

// Conversation resource
message Conversation {
  string id = 1;
  ConversationType type = 2;
  string name = 3; // For group chats
  repeated string participant_ids = 4;
  optional string avatar_url = 5; // For group chats
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  
  // Last message preview
  optional Message last_message = 8;
  
  // Unread count for current user
  int32 unread_count = 9;
  
  // Muted until
  optional google.protobuf.Timestamp muted_until = 10;
}

// Message resource
message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  MessageType type = 4;
  string content = 5; // Text content or caption
  MessageStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  
  // Read receipts
  repeated ReadReceipt read_receipts = 9;
  
  // Media attachments
  repeated MediaAttachment attachments = 10;
  
  // Reply to another message
  optional string reply_to_message_id = 11;
  
  // Message reactions
  repeated Reaction reactions = 12;
  
  // Optional: Translation (for international couples feature)
  optional Translation translation = 13;
}

// Read receipt
message ReadReceipt {
  string user_id = 1;
  google.protobuf.Timestamp read_at = 2;
}

// Media attachment
message MediaAttachment {
  string id = 1;
  MessageType type = 2;
  string url = 3;
  string thumbnail_url = 4;
  optional int64 size_bytes = 5;
  optional string mime_type = 6;
  optional int32 width = 7;
  optional int32 height = 8;
  optional int32 duration_seconds = 9; // For audio/video
}

// Message reaction
message Reaction {
  string emoji = 1;
  repeated string user_ids = 2;
}

// Translation (for international couples)
message Translation {
  string target_language = 1;
  string translated_content = 2;
  google.protobuf.Timestamp translated_at = 3;
}

// Participant info
message Participant {
  string user_id = 1;
  string username = 2;
  string avatar_url = 3;
  bool is_online = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
}

// Typing indicator
message TypingIndicator {
  string user_id = 1;
  bool is_typing = 2;
}

// Message event (for streaming)
message MessageEvent {
  string event_id = 1;
  string event_type = 2; // "message_sent", "message_updated", "message_deleted"
  Message message = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// Typing indicator event (for streaming)
message TypingIndicatorEvent {
  string event_id = 1;
  string user_id = 2;
  bool is_typing = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// CreateConversation
message CreateConversationRequest {
  ConversationType type = 1;
  repeated string participant_ids = 2;
  optional string name = 3; // For group chats
}

message CreateConversationResponse {
  Conversation conversation = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetConversation
message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated Participant participants = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// ListConversations
message ListConversationsRequest {
  common.v1.PaginationRequest pagination = 1;
  optional ConversationType type = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteConversation
message DeleteConversationRequest {
  string conversation_id = 1;
}

message DeleteConversationResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// SendMessage
message SendMessageRequest {
  string conversation_id = 1;
  MessageType type = 2;
  string content = 3;
  repeated string attachment_ids = 4; // Pre-uploaded media IDs
  optional string reply_to_message_id = 5;
  
  // Optional: Request translation to target language
  optional string translate_to = 6;
}

message SendMessageResponse {
  Message message = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetMessage
message GetMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
}

message GetMessageResponse {
  Message message = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// ListMessages
message ListMessagesRequest {
  string conversation_id = 1;
  common.v1.PaginationRequest pagination = 2;
  optional google.protobuf.Timestamp before = 3; // Get messages before this timestamp
  optional google.protobuf.Timestamp after = 4;  // Get messages after this timestamp
}

message ListMessagesResponse {
  repeated Message messages = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteMessage
message DeleteMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
}

message DeleteMessageResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// MarkAsRead
message MarkAsReadRequest {
  string conversation_id = 1;
  optional string message_id = 2; // If not provided, marks all as read
}

message MarkAsReadResponse {
  bool success = 1;
  int32 marked_count = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// SendTypingIndicator
message SendTypingIndicatorRequest {
  string conversation_id = 1;
  bool is_typing = 2;
}

message SendTypingIndicatorResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// StreamMessages
message StreamMessagesRequest {
  string conversation_id = 1;
}

// StreamTypingIndicators
message StreamTypingIndicatorsRequest {
  string conversation_id = 1;
}

// Chat (bidirectional streaming)
message ChatRequest {
  oneof request {
    JoinConversation join = 1;
    SendChatMessage send_message = 2;
    SendChatTyping send_typing = 3;
    AckMessage ack = 4;
  }
}

message JoinConversation {
  string conversation_id = 1;
}

message SendChatMessage {
  string conversation_id = 1;
  string client_message_id = 2; // Client-generated ID for deduplication
  MessageType type = 3;
  string content = 4;
  optional string reply_to_message_id = 5;
}

message SendChatTyping {
  string conversation_id = 1;
  bool is_typing = 2;
}

message AckMessage {
  string message_id = 1;
  MessageStatus status = 2;
}

message ChatResponse {
  oneof response {
    Message message = 1;
    TypingIndicator typing = 2;
    MessageStatusUpdate status_update = 3;
    ErrorResponse error = 4;
  }
}

message MessageStatusUpdate {
  string message_id = 1;
  MessageStatus status = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}