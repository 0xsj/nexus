syntax = "proto3";

package interactions.v1;

option go_package = "github.com/0xsj/nexus/api/interactions/v1;interactionsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Interactions service handles likes, comments, reactions, and bookmarks
service InteractionsService {
  // Like a post
  rpc LikePost(LikePostRequest) returns (LikePostResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/like"
      body: "*"
    };
  }
  
  // Unlike a post
  rpc UnlikePost(UnlikePostRequest) returns (UnlikePostResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{post_id}/like"
    };
  }
  
  // Get users who liked a post
  rpc GetPostLikes(GetPostLikesRequest) returns (GetPostLikesResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/likes"
    };
  }
  
  // Add a reaction to a post
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/reactions"
      body: "*"
    };
  }
  
  // Remove a reaction from a post
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{post_id}/reactions/{reaction_type}"
    };
  }
  
  // Get reactions for a post
  rpc GetPostReactions(GetPostReactionsRequest) returns (GetPostReactionsResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/reactions"
    };
  }
  
  // Create a comment on a post
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/comments"
      body: "*"
    };
  }
  
  // Get comment by ID
  rpc GetComment(GetCommentRequest) returns (GetCommentResponse) {
    option (google.api.http) = {
      get: "/v1/comments/{comment_id}"
    };
  }
  
  // Update a comment
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse) {
    option (google.api.http) = {
      patch: "/v1/comments/{comment_id}"
      body: "*"
    };
  }
  
  // Delete a comment
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse) {
    option (google.api.http) = {
      delete: "/v1/comments/{comment_id}"
    };
  }
  
  // Get comments for a post
  rpc GetPostComments(GetPostCommentsRequest) returns (GetPostCommentsResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/comments"
    };
  }
  
  // Get replies to a comment
  rpc GetCommentReplies(GetCommentRepliesRequest) returns (GetCommentRepliesResponse) {
    option (google.api.http) = {
      get: "/v1/comments/{comment_id}/replies"
    };
  }
  
  // Like a comment
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse) {
    option (google.api.http) = {
      post: "/v1/comments/{comment_id}/like"
      body: "*"
    };
  }
  
  // Unlike a comment
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse) {
    option (google.api.http) = {
      delete: "/v1/comments/{comment_id}/like"
    };
  }
  
  // Bookmark a post
  rpc BookmarkPost(BookmarkPostRequest) returns (BookmarkPostResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/bookmark"
      body: "*"
    };
  }
  
  // Remove bookmark from a post
  rpc UnbookmarkPost(UnbookmarkPostRequest) returns (UnbookmarkPostResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{post_id}/bookmark"
    };
  }
  
  // Get user's bookmarked posts
  rpc GetBookmarks(GetBookmarksRequest) returns (GetBookmarksResponse) {
    option (google.api.http) = {
      get: "/v1/bookmarks"
    };
  }
  
  // Share/repost a post
  rpc SharePost(SharePostRequest) returns (SharePostResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/share"
      body: "*"
    };
  }
  
  // Get shares of a post
  rpc GetPostShares(GetPostSharesRequest) returns (GetPostSharesResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/shares"
    };
  }
  
  // Report content (post or comment)
  rpc ReportContent(ReportContentRequest) returns (ReportContentResponse) {
    option (google.api.http) = {
      post: "/v1/reports"
      body: "*"
    };
  }
  
  // Stream real-time comments (server streaming)
  rpc StreamComments(StreamCommentsRequest) returns (stream CommentEvent) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}/comments/stream"
    };
  }
}

// Reaction type
enum ReactionType {
  REACTION_TYPE_UNSPECIFIED = 0;
  REACTION_TYPE_LIKE = 1;
  REACTION_TYPE_LOVE = 2;
  REACTION_TYPE_LAUGH = 3;
  REACTION_TYPE_WOW = 4;
  REACTION_TYPE_SAD = 5;
  REACTION_TYPE_ANGRY = 6;
}

// Report reason
enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_SPAM = 1;
  REPORT_REASON_HARASSMENT = 2;
  REPORT_REASON_HATE_SPEECH = 3;
  REPORT_REASON_VIOLENCE = 4;
  REPORT_REASON_NUDITY = 5;
  REPORT_REASON_FALSE_INFO = 6;
  REPORT_REASON_COPYRIGHT = 7;
  REPORT_REASON_OTHER = 8;
}

// Content type for reporting
enum ContentTypeEnum {
  CONTENT_TYPE_ENUM_UNSPECIFIED = 0;
  CONTENT_TYPE_ENUM_POST = 1;
  CONTENT_TYPE_ENUM_COMMENT = 2;
  CONTENT_TYPE_ENUM_USER = 3;
  CONTENT_TYPE_ENUM_MESSAGE = 4;
}

// Like resource
message Like {
  string user_id = 1;
  string target_id = 2; // Post ID or Comment ID
  string target_type = 3; // "post" or "comment"
  google.protobuf.Timestamp created_at = 4;
}

// Reaction resource
message Reaction {
  string user_id = 1;
  string post_id = 2;
  ReactionType type = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Reaction summary for a post
message ReactionSummary {
  ReactionType type = 1;
  int32 count = 2;
  bool reacted_by_user = 3;
}

// Comment resource
message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  
  // Author info
  CommentAuthor author = 7;
  
  // Reply info
  optional string parent_comment_id = 8;
  int32 reply_count = 9;
  
  // Engagement
  int32 likes_count = 10;
  bool is_liked_by_user = 11;
  
  // Mentioned users
  repeated string mentioned_user_ids = 12;
  
  // Flagged/moderated
  bool is_deleted = 13;
  bool is_edited = 14;
}

// Comment author
message CommentAuthor {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool is_verified = 5;
}

// Bookmark resource
message Bookmark {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  google.protobuf.Timestamp created_at = 4;
  optional string collection_id = 5; // For organizing bookmarks
}

// Share/repost resource
message Share {
  string id = 1;
  string user_id = 2;
  string post_id = 3;
  optional string comment = 4; // User's comment on the share
  google.protobuf.Timestamp created_at = 5;
}

// Report resource
message Report {
  string id = 1;
  string reporter_id = 2;
  ContentTypeEnum content_type = 3;
  string content_id = 4;
  ReportReason reason = 5;
  optional string description = 6;
  google.protobuf.Timestamp created_at = 7;
  
  // Report status (for moderation)
  string status = 8; // "pending", "reviewed", "actioned", "dismissed"
}

// Comment event (for streaming)
message CommentEvent {
  string event_id = 1;
  string event_type = 2; // "comment_created", "comment_updated", "comment_deleted"
  Comment comment = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// LikePost
message LikePostRequest {
  string post_id = 1;
}

message LikePostResponse {
  bool success = 1;
  Like like = 2;
  int32 total_likes = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// UnlikePost
message UnlikePostRequest {
  string post_id = 1;
}

message UnlikePostResponse {
  bool success = 1;
  int32 total_likes = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// GetPostLikes
message GetPostLikesRequest {
  string post_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message GetPostLikesResponse {
  repeated CommentAuthor users = 1; // Reusing CommentAuthor for user info
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// AddReaction
message AddReactionRequest {
  string post_id = 1;
  ReactionType reaction_type = 2;
}

message AddReactionResponse {
  bool success = 1;
  Reaction reaction = 2;
  repeated ReactionSummary reactions_summary = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// RemoveReaction
message RemoveReactionRequest {
  string post_id = 1;
  ReactionType reaction_type = 2;
}

message RemoveReactionResponse {
  bool success = 1;
  repeated ReactionSummary reactions_summary = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// GetPostReactions
message GetPostReactionsRequest {
  string post_id = 1;
  optional ReactionType reaction_type = 2; // Filter by specific reaction
  common.v1.PaginationRequest pagination = 3;
}

message GetPostReactionsResponse {
  repeated ReactionSummary reactions_summary = 1;
  repeated Reaction reactions = 2; // Detailed list
  common.v1.PaginationResponse pagination = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// CreateComment
message CreateCommentRequest {
  string post_id = 1;
  string content = 2;
  optional string parent_comment_id = 3; // For replies
  repeated string mentioned_user_ids = 4;
}

message CreateCommentResponse {
  Comment comment = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetComment
message GetCommentRequest {
  string comment_id = 1;
}

message GetCommentResponse {
  Comment comment = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdateComment
message UpdateCommentRequest {
  string comment_id = 1;
  string content = 2;
}

message UpdateCommentResponse {
  Comment comment = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteComment
message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetPostComments
message GetPostCommentsRequest {
  string post_id = 1;
  common.v1.PaginationRequest pagination = 2;
  optional common.v1.SortOrder sort_order = 3;
}

message GetPostCommentsResponse {
  repeated Comment comments = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// GetCommentReplies
message GetCommentRepliesRequest {
  string comment_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message GetCommentRepliesResponse {
  repeated Comment replies = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// LikeComment
message LikeCommentRequest {
  string comment_id = 1;
}

message LikeCommentResponse {
  bool success = 1;
  int32 total_likes = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// UnlikeComment
message UnlikeCommentRequest {
  string comment_id = 1;
}

message UnlikeCommentResponse {
  bool success = 1;
  int32 total_likes = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// BookmarkPost
message BookmarkPostRequest {
  string post_id = 1;
  optional string collection_id = 2;
}

message BookmarkPostResponse {
  bool success = 1;
  Bookmark bookmark = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// UnbookmarkPost
message UnbookmarkPostRequest {
  string post_id = 1;
}

message UnbookmarkPostResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetBookmarks
message GetBookmarksRequest {
  common.v1.PaginationRequest pagination = 1;
  optional string collection_id = 2;
}

message GetBookmarksResponse {
  repeated Bookmark bookmarks = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// SharePost
message SharePostRequest {
  string post_id = 1;
  optional string comment = 2;
}

message SharePostResponse {
  bool success = 1;
  Share share = 2;
  int32 total_shares = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// GetPostShares
message GetPostSharesRequest {
  string post_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message GetPostSharesResponse {
  repeated Share shares = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// ReportContent
message ReportContentRequest {
  ContentTypeEnum content_type = 1;
  string content_id = 2;
  ReportReason reason = 3;
  optional string description = 4;
}

message ReportContentResponse {
  bool success = 1;
  Report report = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// StreamComments
message StreamCommentsRequest {
  string post_id = 1;
}