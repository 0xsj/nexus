syntax = "proto3";

package settings.v1;

option go_package = "github.com/0xsj/nexus/api/settings/v1;settingsv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "common/v1/common.proto";

// Settings service handles user preferences and app settings
service SettingsService {
  // Get all settings
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings"
    };
  }
  
  // Update settings
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/settings"
      body: "*"
    };
  }
  
  // Get notification settings
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings/notifications"
    };
  }
  
  // Update notification settings
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/settings/notifications"
      body: "*"
    };
  }
  
  // Get privacy settings
  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns (GetPrivacySettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings/privacy"
    };
  }
  
  // Update privacy settings
  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns (UpdatePrivacySettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/settings/privacy"
      body: "*"
    };
  }
  
  // Get appearance settings
  rpc GetAppearanceSettings(GetAppearanceSettingsRequest) returns (GetAppearanceSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings/appearance"
    };
  }
  
  // Update appearance settings
  rpc UpdateAppearanceSettings(UpdateAppearanceSettingsRequest) returns (UpdateAppearanceSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/settings/appearance"
      body: "*"
    };
  }
  
  // Get language settings
  rpc GetLanguageSettings(GetLanguageSettingsRequest) returns (GetLanguageSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/settings/language"
    };
  }
  
  // Update language settings
  rpc UpdateLanguageSettings(UpdateLanguageSettingsRequest) returns (UpdateLanguageSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/settings/language"
      body: "*"
    };
  }
  
  // Export user data (GDPR)
  rpc ExportData(ExportDataRequest) returns (ExportDataResponse) {
    option (google.api.http) = {
      post: "/v1/settings/export"
      body: "*"
    };
  }
  
  // Delete account
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
  option (google.api.http) = {
    post: "/v1/settings/account/delete"
    body: "*"
  };
}
  
  // Stream settings sync (server streaming for multi-device sync)
  rpc StreamSettingsSync(StreamSettingsSyncRequest) returns (stream SettingsSyncEvent) {
    option (google.api.http) = {
      get: "/v1/settings/sync"
    };
  }
}

// Theme
enum Theme {
  THEME_UNSPECIFIED = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
  THEME_AUTO = 3; // Follow system preference
}

// Language code (ISO 639-1)
enum LanguageCode {
  LANGUAGE_CODE_UNSPECIFIED = 0;
  LANGUAGE_CODE_EN = 1; // English
  LANGUAGE_CODE_TR = 2; // Turkish
  LANGUAGE_CODE_ES = 3; // Spanish
  LANGUAGE_CODE_FR = 4; // French
  LANGUAGE_CODE_DE = 5; // German
  LANGUAGE_CODE_IT = 6; // Italian
  LANGUAGE_CODE_PT = 7; // Portuguese
  LANGUAGE_CODE_RU = 8; // Russian
  LANGUAGE_CODE_JA = 9; // Japanese
  LANGUAGE_CODE_KO = 10; // Korean
  LANGUAGE_CODE_ZH = 11; // Chinese
  LANGUAGE_CODE_AR = 12; // Arabic
}

// Who can see your content
enum VisibilityLevel {
  VISIBILITY_LEVEL_UNSPECIFIED = 0;
  VISIBILITY_LEVEL_PUBLIC = 1;
  VISIBILITY_LEVEL_FOLLOWERS = 2;
  VISIBILITY_LEVEL_PRIVATE = 3;
}

// Who can contact you
enum ContactPermission {
  CONTACT_PERMISSION_UNSPECIFIED = 0;
  CONTACT_PERMISSION_EVERYONE = 1;
  CONTACT_PERMISSION_FOLLOWERS = 2;
  CONTACT_PERMISSION_MUTUAL = 3; // Mutual followers only
  CONTACT_PERMISSION_NONE = 4;
}

// All user settings
message Settings {
  NotificationSettings notifications = 1;
  PrivacySettings privacy = 2;
  AppearanceSettings appearance = 3;
  LanguageSettings language = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Notification settings
message NotificationSettings {
  // Push notifications
  bool push_enabled = 1;
  
  // Email notifications
  bool email_enabled = 2;
  
  // In-app notifications
  bool in_app_enabled = 3;
  
  // Per-type settings
  bool likes_enabled = 4;
  bool comments_enabled = 5;
  bool follows_enabled = 6;
  bool mentions_enabled = 7;
  bool messages_enabled = 8;
  bool shares_enabled = 9;
  
  // Quiet hours
  optional QuietHours quiet_hours = 10;
  
  // Digest settings
  bool daily_digest_enabled = 11;
  bool weekly_digest_enabled = 12;
}

// Quiet hours (do not disturb)
message QuietHours {
  bool enabled = 1;
  string start_time = 2; // "22:00"
  string end_time = 3;   // "08:00"
  string timezone = 4;   // IANA timezone
  repeated int32 days = 5; // 0=Sunday, 1=Monday, etc.
}

// Privacy settings
message PrivacySettings {
  // Profile visibility
  VisibilityLevel profile_visibility = 1;
  
  // Who can see your posts
  VisibilityLevel default_post_visibility = 2;
  
  // Who can see your followers/following lists
  VisibilityLevel followers_visibility = 3;
  VisibilityLevel following_visibility = 4;
  
  // Who can contact you
  ContactPermission message_permission = 5;
  ContactPermission comment_permission = 6;
  ContactPermission tag_permission = 7;
  
  // Privacy flags
  bool show_online_status = 8;
  bool show_last_seen = 9;
  bool show_read_receipts = 10;
  bool show_typing_indicator = 11;
  bool allow_search_indexing = 12;
  bool allow_mentions = 13;
  
  // Private account
  bool is_private = 14;
  
  // Location
  bool share_location = 15;
}

// Appearance settings
message AppearanceSettings {
  Theme theme = 1;
  
  // Font size
  int32 font_size = 2; // 0=small, 1=medium, 2=large
  
  // Display preferences
  bool show_profile_photos = 3;
  bool show_media_previews = 4;
  bool auto_play_videos = 5;
  bool reduce_motion = 6; // Accessibility
  bool high_contrast = 7; // Accessibility
  
  // Content preferences
  bool show_sensitive_content = 8;
  bool blur_sensitive_media = 9;
}

// Language settings
message LanguageSettings {
  LanguageCode primary_language = 1;
  repeated LanguageCode additional_languages = 2;
  
  // Auto-translate settings
  bool auto_translate_enabled = 3;
  LanguageCode translate_to = 4;
  
  // Content preferences
  bool show_translations = 5;
}

// Settings sync event
message SettingsSyncEvent {
  string event_id = 1;
  string setting_category = 2; // "notifications", "privacy", "appearance", "language"
  Settings settings = 3;
  google.protobuf.Timestamp timestamp = 4;
}

// GetSettings
message GetSettingsRequest {
  // User identified from auth token
}

message GetSettingsResponse {
  Settings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdateSettings
message UpdateSettingsRequest {
  google.protobuf.FieldMask update_mask = 1;
  optional NotificationSettings notifications = 2;
  optional PrivacySettings privacy = 3;
  optional AppearanceSettings appearance = 4;
  optional LanguageSettings language = 5;
}

message UpdateSettingsResponse {
  Settings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetNotificationSettings
message GetNotificationSettingsRequest {
  // User identified from auth token
}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdateNotificationSettings
message UpdateNotificationSettingsRequest {
  google.protobuf.FieldMask update_mask = 1;
  optional bool push_enabled = 2;
  optional bool email_enabled = 3;
  optional bool in_app_enabled = 4;
  optional bool likes_enabled = 5;
  optional bool comments_enabled = 6;
  optional bool follows_enabled = 7;
  optional bool mentions_enabled = 8;
  optional bool messages_enabled = 9;
  optional bool shares_enabled = 10;
  optional QuietHours quiet_hours = 11;
  optional bool daily_digest_enabled = 12;
  optional bool weekly_digest_enabled = 13;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetPrivacySettings
message GetPrivacySettingsRequest {
  // User identified from auth token
}

message GetPrivacySettingsResponse {
  PrivacySettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdatePrivacySettings
message UpdatePrivacySettingsRequest {
  google.protobuf.FieldMask update_mask = 1;
  optional VisibilityLevel profile_visibility = 2;
  optional VisibilityLevel default_post_visibility = 3;
  optional VisibilityLevel followers_visibility = 4;
  optional VisibilityLevel following_visibility = 5;
  optional ContactPermission message_permission = 6;
  optional ContactPermission comment_permission = 7;
  optional ContactPermission tag_permission = 8;
  optional bool show_online_status = 9;
  optional bool show_last_seen = 10;
  optional bool show_read_receipts = 11;
  optional bool show_typing_indicator = 12;
  optional bool allow_search_indexing = 13;
  optional bool allow_mentions = 14;
  optional bool is_private = 15;
  optional bool share_location = 16;
}

message UpdatePrivacySettingsResponse {
  PrivacySettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetAppearanceSettings
message GetAppearanceSettingsRequest {
  // User identified from auth token
}

message GetAppearanceSettingsResponse {
  AppearanceSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdateAppearanceSettings
message UpdateAppearanceSettingsRequest {
  google.protobuf.FieldMask update_mask = 1;
  optional Theme theme = 2;
  optional int32 font_size = 3;
  optional bool show_profile_photos = 4;
  optional bool show_media_previews = 5;
  optional bool auto_play_videos = 6;
  optional bool reduce_motion = 7;
  optional bool high_contrast = 8;
  optional bool show_sensitive_content = 9;
  optional bool blur_sensitive_media = 10;
}

message UpdateAppearanceSettingsResponse {
  AppearanceSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetLanguageSettings
message GetLanguageSettingsRequest {
  // User identified from auth token
}

message GetLanguageSettingsResponse {
  LanguageSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// UpdateLanguageSettings
message UpdateLanguageSettingsRequest {
  google.protobuf.FieldMask update_mask = 1;
  optional LanguageCode primary_language = 2;
  repeated LanguageCode additional_languages = 3;
  optional bool auto_translate_enabled = 4;
  optional LanguageCode translate_to = 5;
  optional bool show_translations = 6;
}

message UpdateLanguageSettingsResponse {
  LanguageSettings settings = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// ExportData
message ExportDataRequest {
  repeated string data_types = 1; // ["profile", "posts", "messages", "media"]
  string format = 2; // "json", "csv"
}

message ExportDataResponse {
  string export_id = 1;
  string status = 2; // "pending", "processing", "completed"
  optional string download_url = 3; // Available when completed
  optional google.protobuf.Timestamp expires_at = 4;
  common.v1.ResponseMetadata metadata = 10;
}

// DeleteAccount
message DeleteAccountRequest {
  string password = 1;
  optional string reason = 2;
}

message DeleteAccountResponse {
  bool success = 1;
  google.protobuf.Timestamp scheduled_deletion_at = 2; // Grace period
  common.v1.ResponseMetadata metadata = 10;
}

// StreamSettingsSync
message StreamSettingsSyncRequest {
  // User identified from auth token
}