syntax = "proto3";

package users.v1;

option go_package = "github.com/0xsj/nexus/api/users/v1;usersv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "common/v1/common.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
  
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }
  
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      patch: "/v1/users/{user_id}"
      body: "*"
    };
  }
  
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{user_id}"
    };
  }
  
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }
}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  bool email_verified = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional string display_name = 8;
  optional string avatar_url = 9;
  optional string bio = 10;
}

message CreateUserRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  common.v1.ClientContext client_context = 10;
}

message CreateUserResponse {
  User user = 1;
  common.v1.ResponseMetadata metadata = 10;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
  common.v1.ResponseMetadata metadata = 10;
}

message UpdateUserRequest {
  string user_id = 1;
  google.protobuf.FieldMask update_mask = 2;
  optional string email = 3;
  optional string username = 4;
  optional string display_name = 5;
  optional string avatar_url = 6;
  optional string bio = 7;
}

message UpdateUserResponse {
  User user = 1;
  common.v1.ResponseMetadata metadata = 10;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

message ListUsersRequest {
  common.v1.PaginationRequest pagination = 1;
  optional bool is_active = 2;
  optional string query = 3;
  optional string sort_by = 4;
  common.v1.SortOrder sort_order = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}