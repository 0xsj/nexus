syntax = "proto3";

package social.v1;

option go_package = "github.com/0xsj/nexus/api/social/v1;socialv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Social service handles follow/unfollow and social graph
service SocialService {
  // Follow a user
  rpc FollowUser(FollowUserRequest) returns (FollowUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/follow"
      body: "*"
    };
  }
  
  // Unfollow a user
  rpc UnfollowUser(UnfollowUserRequest) returns (UnfollowUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{user_id}/follow"
    };
  }
  
  // Get followers of a user
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/followers"
    };
  }
  
  // Get users that a user is following
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/following"
    };
  }
  
  // Get mutual followers (friends)
  rpc GetMutualFollowers(GetMutualFollowersRequest) returns (GetMutualFollowersResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/mutual"
    };
  }
  
  // Check if user A follows user B
  rpc CheckFollowStatus(CheckFollowStatusRequest) returns (CheckFollowStatusResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/following/{target_user_id}"
    };
  }
  
  // Get follow suggestions (who to follow)
  rpc GetFollowSuggestions(GetFollowSuggestionsRequest) returns (GetFollowSuggestionsResponse) {
    option (google.api.http) = {
      get: "/v1/users/suggestions"
    };
  }
  
  // Block a user
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/block"
      body: "*"
    };
  }
  
  // Unblock a user
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{user_id}/block"
    };
  }
  
  // Get blocked users
  rpc GetBlockedUsers(GetBlockedUsersRequest) returns (GetBlockedUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users/blocked"
    };
  }
  
  // Mute a user (hide their content without unfollowing)
  rpc MuteUser(MuteUserRequest) returns (MuteUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/mute"
      body: "*"
    };
  }
  
  // Unmute a user
  rpc UnmuteUser(UnmuteUserRequest) returns (UnmuteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{user_id}/mute"
    };
  }
  
  // Get muted users
  rpc GetMutedUsers(GetMutedUsersRequest) returns (GetMutedUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users/muted"
    };
  }
  
  // Stream follow events (real-time notifications when someone follows/unfollows)
  rpc StreamFollowEvents(StreamFollowEventsRequest) returns (stream FollowEvent) {
    option (google.api.http) = {
      get: "/v1/users/follow-events/stream"
    };
  }
}

// Relationship status
enum RelationshipStatus {
  RELATIONSHIP_STATUS_UNSPECIFIED = 0;
  RELATIONSHIP_STATUS_NONE = 1;          // No relationship
  RELATIONSHIP_STATUS_FOLLOWING = 2;     // Current user follows target
  RELATIONSHIP_STATUS_FOLLOWED_BY = 3;   // Target follows current user
  RELATIONSHIP_STATUS_MUTUAL = 4;        // Both follow each other (friends)
  RELATIONSHIP_STATUS_BLOCKED = 5;       // Current user blocked target
  RELATIONSHIP_STATUS_BLOCKED_BY = 6;    // Target blocked current user
  RELATIONSHIP_STATUS_MUTED = 7;         // Current user muted target
}

// User profile (simplified for social context)
message UserProfile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  optional string bio = 5;
  bool is_verified = 6;
  
  // Relationship with current user
  RelationshipStatus relationship = 7;
  
  // Follow counts
  int32 followers_count = 8;
  int32 following_count = 9;
  int32 posts_count = 10;
}

// Follow relationship
message Follow {
  string follower_id = 1;
  string following_id = 2;
  google.protobuf.Timestamp followed_at = 3;
  
  // Optional: Notification settings for this follow
  bool notifications_enabled = 4;
}

// Block relationship
message Block {
  string blocker_id = 1;
  string blocked_id = 2;
  google.protobuf.Timestamp blocked_at = 3;
  optional string reason = 4;
}

// Mute relationship
message Mute {
  string muter_id = 1;
  string muted_id = 2;
  google.protobuf.Timestamp muted_at = 3;
  optional google.protobuf.Timestamp muted_until = 4; // Temporary mute
}

// Follow suggestion
message FollowSuggestion {
  UserProfile user = 1;
  string reason = 2; // "mutual_friends", "popular", "similar_interests"
  repeated string mutual_follower_ids = 3;
  int32 mutual_count = 4;
}

// Follow event (for streaming)
message FollowEvent {
  string event_id = 1;
  string event_type = 2; // "user_followed", "user_unfollowed"
  UserProfile user = 3; // User who performed the action
  google.protobuf.Timestamp timestamp = 4;
}

// FollowUser
message FollowUserRequest {
  string user_id = 1;
  optional bool enable_notifications = 2; // Get notified of their posts
}

message FollowUserResponse {
  bool success = 1;
  Follow follow = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// UnfollowUser
message UnfollowUserRequest {
  string user_id = 1;
}

message UnfollowUserResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetFollowers
message GetFollowersRequest {
  string user_id = 1;
  common.v1.PaginationRequest pagination = 2;
  optional string query = 3; // Search within followers
}

message GetFollowersResponse {
  repeated UserProfile followers = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// GetFollowing
message GetFollowingRequest {
  string user_id = 1;
  common.v1.PaginationRequest pagination = 2;
  optional string query = 3; // Search within following
}

message GetFollowingResponse {
  repeated UserProfile following = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// GetMutualFollowers
message GetMutualFollowersRequest {
  string user_id = 1;
  common.v1.PaginationRequest pagination = 2;
}

message GetMutualFollowersResponse {
  repeated UserProfile mutual_followers = 1;
  common.v1.PaginationResponse pagination = 2;
  int32 total_count = 3;
  common.v1.ResponseMetadata metadata = 10;
}

// CheckFollowStatus
message CheckFollowStatusRequest {
  string user_id = 1;
  string target_user_id = 2;
}

message CheckFollowStatusResponse {
  bool is_following = 1;
  bool is_followed_by = 2;
  RelationshipStatus relationship = 3;
  optional Follow follow = 4;
  common.v1.ResponseMetadata metadata = 10;
}

// GetFollowSuggestions
message GetFollowSuggestionsRequest {
  common.v1.PaginationRequest pagination = 1;
  optional string reason_filter = 2; // Filter by reason type
}

message GetFollowSuggestionsResponse {
  repeated FollowSuggestion suggestions = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// BlockUser
message BlockUserRequest {
  string user_id = 1;
  optional string reason = 2;
}

message BlockUserResponse {
  bool success = 1;
  Block block = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// UnblockUser
message UnblockUserRequest {
  string user_id = 1;
}

message UnblockUserResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetBlockedUsers
message GetBlockedUsersRequest {
  common.v1.PaginationRequest pagination = 1;
}

message GetBlockedUsersResponse {
  repeated UserProfile blocked_users = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// MuteUser
message MuteUserRequest {
  string user_id = 1;
  optional google.protobuf.Timestamp mute_until = 2; // Temporary mute
}

message MuteUserResponse {
  bool success = 1;
  Mute mute = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// UnmuteUser
message UnmuteUserRequest {
  string user_id = 1;
}

message UnmuteUserResponse {
  bool success = 1;
  common.v1.ResponseMetadata metadata = 10;
}

// GetMutedUsers
message GetMutedUsersRequest {
  common.v1.PaginationRequest pagination = 1;
}

message GetMutedUsersResponse {
  repeated UserProfile muted_users = 1;
  common.v1.PaginationResponse pagination = 2;
  common.v1.ResponseMetadata metadata = 10;
}

// StreamFollowEvents
message StreamFollowEventsRequest {
  // User identified from auth token
}