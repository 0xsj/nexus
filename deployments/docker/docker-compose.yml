name: nexus

services:
  # ============================================================================
  # Platform API (Go)
  # ============================================================================
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/platform.Dockerfile
    container_name: nexus-api
    ports:
      - "8090:8090"
    environment:
      # App
      - ENV=development
      - PORT=8090
      - LOG_LEVEL=debug
      # Database
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=nexus
      - DATABASE_PASSWORD=nexus
      - DATABASE_NAME=nexus
      - DATABASE_SSLMODE=disable
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      # Vault
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=nexus-dev-token
      # NATS
      - NATS_URL=nats://nats:4222
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=nexus
      - MINIO_SECRET_KEY=nexus-secret-key
      - MINIO_USE_SSL=false
      # Mail
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@nexus.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # Frontend (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ../..
      dockerfile: deployments/docker/frontend.Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8090
    container_name: nexus-frontend
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8090
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexus
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6391:6379"
    command: redis-server --appendonly yes
    volumes:
      - nexus-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # HashiCorp Vault (Dev Mode)
  # ============================================================================
  vault:
    image: hashicorp/vault:1.15
    container_name: nexus-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=nexus-dev-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # NATS with JetStream
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: nexus-nats
    ports:
      - "4222:4222" # Client
      - "8222:8222" # Monitoring
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nexus-nats-data:/data
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # MinIO (S3-compatible storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    ports:
      - "9010:9000" # API
      - "9011:9001" # Console
    environment:
      - MINIO_ROOT_USER=nexus
      - MINIO_ROOT_PASSWORD=nexus-secret-key
    command: server /data --console-address ":9001"
    volumes:
      - nexus-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # MinIO Init (Create default buckets)
  # ============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: nexus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nexus http://minio:9000 nexus nexus-secret-key;
      mc mb nexus/credentials --ignore-existing;
      mc mb nexus/attachments --ignore-existing;
      mc mb nexus/exports --ignore-existing;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - nexus-network

  # ============================================================================
  # Mailpit (Email testing)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: nexus-mailpit
    ports:
      - "1030:1025" # SMTP
      - "8030:8025" # Web UI
    restart: unless-stopped
    networks:
      - nexus-network

  # ============================================================================
  # Vault Init (Setup secrets engines)
  # ============================================================================
  vault-init:
    image: hashicorp/vault:1.15
    container_name: nexus-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=nexus-dev-token
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Vault...';
      sleep 2;

      echo 'Enabling KV secrets engine...';
      vault secrets enable -path=nexus kv-v2 || true;

      echo 'Enabling Transit secrets engine for signing keys...';
      vault secrets enable -path=transit transit || true;

      echo 'Creating signing key for credentials...';
      vault write -f transit/keys/credential-signing type=ed25519 || true;

      echo 'Vault initialization complete';
      "
    networks:
      - nexus-network

# ============================================================================
# Networks
# ============================================================================
networks:
  nexus-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  nexus-postgres-data:
  nexus-redis-data:
  nexus-nats-data:
  nexus-minio-data:
