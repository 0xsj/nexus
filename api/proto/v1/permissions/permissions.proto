syntax = "proto3";

package nexus.permissions.v1;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "github.com/0xsj/nexus-go/gen/proto/v1/permissions;permissionsv1";

// ============================================================================
// Enums
// ============================================================================

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_CREATE = 1;
  ACTION_READ = 2;
  ACTION_UPDATE = 3;
  ACTION_DELETE = 4;
  ACTION_MANAGE = 5;
  ACTION_ALL = 6;
}

enum Resource {
  RESOURCE_UNSPECIFIED = 0;
  RESOURCE_USERS = 1;
  RESOURCE_TENANTS = 2;
  RESOURCE_FLAGS = 3;
  RESOURCE_ROLES = 4;
  RESOURCE_API_KEYS = 5;
  RESOURCE_AUDIT_LOGS = 6;
  RESOURCE_SELF = 7;
  RESOURCE_ALL = 8;
}

// ============================================================================
// Core Messages
// ============================================================================

message Permission {
  Action action = 1;
  Resource resource = 2;
}

message Role {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  repeated string permissions = 5;
  bool is_system = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int32 version = 9;
}

message RoleSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_system = 4;
  int32 permissions_count = 5;
}

message Assignment {
  string id = 1;
  string user_id = 2;
  string role_id = 3;
  string role_name = 4;
  string tenant_id = 5;
  optional string resource_id = 6;
  optional google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  string created_by = 9;
}

message UserPermissions {
  string user_id = 1;
  string tenant_id = 2;
  repeated string permissions = 3;
  repeated string roles = 4;
}

message RoleFilter {
  string tenant_id = 1;
  optional bool is_system = 2;
  string name_contains = 3;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

// CreateRole
message CreateRoleRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message CreateRoleResponse {
  Role role = 1;
}

// GetRole
message GetRoleRequest {
  string id = 1;
}

message GetRoleResponse {
  Role role = 1;
}

// ListRoles
message ListRolesRequest {
  RoleFilter filter = 1;
  nexus.common.v1.PageRequest pagination = 2;
}

message ListRolesResponse {
  repeated RoleSummary roles = 1;
  nexus.common.v1.PageResponse pagination = 2;
}

// UpdateRole
message UpdateRoleRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  repeated string permissions = 4;
}

message UpdateRoleResponse {
  Role role = 1;
}

// DeleteRole
message DeleteRoleRequest {
  string id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

// AssignRole
message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
  string tenant_id = 3;
  optional string resource_id = 4;
  optional google.protobuf.Timestamp expires_at = 5;
}

message AssignRoleResponse {
  Assignment assignment = 1;
}

// RevokeRole
message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
  string tenant_id = 3;
  optional string resource_id = 4;
  string reason = 5;
}

message RevokeRoleResponse {
  bool success = 1;
}

// CheckPermission
message CheckPermissionRequest {
  string user_id = 1;
  string tenant_id = 2;
  string permission = 3;
  optional string resource_id = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string permission = 2;
  string reason = 3;
}

// GetUserPermissions
message GetUserPermissionsRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message GetUserPermissionsResponse {
  UserPermissions user_permissions = 1;
}

// ============================================================================
// Service
// ============================================================================

service PermissionsService {
  // Role management
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // Role assignment
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);

  // Permission queries
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (GetUserPermissionsResponse);
}