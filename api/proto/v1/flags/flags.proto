syntax = "proto3";

package nexus.flags.v1;

import "google/protobuf/timestamp.proto";
import "common/common.proto";

option go_package = "github.com/0xsj/nexus-go/gen/proto/v1/flags;flagsv1";

// ============================================================================
// Enums
// ============================================================================

enum RuleType {
  RULE_TYPE_UNSPECIFIED = 0;
  RULE_TYPE_TENANT = 1;
  RULE_TYPE_USER = 2;
  RULE_TYPE_PERCENT = 3;
  RULE_TYPE_ATTRIBUTE = 4;
}

enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_EQUALS = 1;
  OPERATOR_NOT_EQUALS = 2;
  OPERATOR_CONTAINS = 3;
  OPERATOR_NOT_CONTAINS = 4;
  OPERATOR_IN = 5;
  OPERATOR_NOT_IN = 6;
  OPERATOR_GREATER_THAN = 7;
  OPERATOR_LESS_THAN = 8;
  OPERATOR_EXISTS = 9;
  OPERATOR_NOT_EXISTS = 10;
}

enum EvaluationReason {
  EVALUATION_REASON_UNSPECIFIED = 0;
  EVALUATION_REASON_DEFAULT = 1;
  EVALUATION_REASON_DISABLED = 2;
  EVALUATION_REASON_OVERRIDE = 3;
  EVALUATION_REASON_RULE = 4;
  EVALUATION_REASON_PERCENTAGE = 5;
  EVALUATION_REASON_ERROR = 6;
}

// ============================================================================
// Core Messages
// ============================================================================

message Variant {
  string key = 1;
  string value = 2;
  int32 weight = 3;
  string description = 4;
}

message Rule {
  string id = 1;
  RuleType type = 2;
  string attribute = 3;
  Operator operator = 4;
  repeated string values = 5;
  int32 percentage = 6;
  string variant_key = 7;
  int32 priority = 8;
}

message Override {
  string target_type = 1;
  string target_id = 2;
  string variant_key = 3;
}

message Flag {
  string id = 1;
  string tenant_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  bool enabled = 6;
  repeated Variant variants = 7;
  string default_variant = 8;
  repeated Rule rules = 9;
  repeated Override overrides = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int32 version = 13;
}

message FlagSummary {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool enabled = 5;
  int32 rule_count = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message EvaluationContext {
  string tenant_id = 1;
  string user_id = 2;
  map<string, string> attributes = 3;
}

message EvaluationResult {
  string flag_key = 1;
  bool enabled = 2;
  string variant_key = 3;
  string variant_value = 4;
  EvaluationReason reason = 5;
}

message FlagFilter {
  string tenant_id = 1;
  optional bool enabled = 2;
  string key_contains = 3;
  string name_contains = 4;
}

// ============================================================================
// Request/Response Messages
// ============================================================================

// CreateFlag
message CreateFlagRequest {
  string tenant_id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool enabled = 5;
}

message CreateFlagResponse {
  Flag flag = 1;
}

// GetFlag
message GetFlagRequest {
  string id = 1;
}

message GetFlagResponse {
  Flag flag = 1;
}

// ListFlags
message ListFlagsRequest {
  FlagFilter filter = 1;
  nexus.common.v1.PageRequest pagination = 2;
}

message ListFlagsResponse {
  repeated FlagSummary flags = 1;
  nexus.common.v1.PageResponse pagination = 2;
}

// UpdateFlag
message UpdateFlagRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}

message UpdateFlagResponse {
  Flag flag = 1;
}

// DeleteFlag
message DeleteFlagRequest {
  string id = 1;
}

message DeleteFlagResponse {
  bool success = 1;
}

// EnableFlag
message EnableFlagRequest {
  string id = 1;
}

message EnableFlagResponse {
  Flag flag = 1;
}

// DisableFlag
message DisableFlagRequest {
  string id = 1;
}

message DisableFlagResponse {
  Flag flag = 1;
}

// AddRule
message AddRuleRequest {
  string flag_id = 1;
  RuleType type = 2;
  string attribute = 3;
  Operator operator = 4;
  repeated string values = 5;
  int32 percentage = 6;
  string variant_key = 7;
  int32 priority = 8;
}

message AddRuleResponse {
  Flag flag = 1;
}

// RemoveRule
message RemoveRuleRequest {
  string flag_id = 1;
  string rule_id = 2;
}

message RemoveRuleResponse {
  Flag flag = 1;
}

// SetOverride
message SetOverrideRequest {
  string flag_id = 1;
  string target_type = 2;
  string target_id = 3;
  string variant_key = 4;
}

message SetOverrideResponse {
  Flag flag = 1;
}

// RemoveOverride
message RemoveOverrideRequest {
  string flag_id = 1;
  string target_type = 2;
  string target_id = 3;
}

message RemoveOverrideResponse {
  Flag flag = 1;
}

// EvaluateFlag
message EvaluateFlagRequest {
  string flag_key = 1;
  EvaluationContext context = 2;
}

message EvaluateFlagResponse {
  EvaluationResult result = 1;
}

// EvaluateFlags (batch)
message EvaluateFlagsRequest {
  repeated string flag_keys = 1;
  EvaluationContext context = 2;
}

message EvaluateFlagsResponse {
  repeated EvaluationResult results = 1;
}

// ============================================================================
// Service
// ============================================================================

service FlagsService {
  // Flag CRUD
  rpc CreateFlag(CreateFlagRequest) returns (CreateFlagResponse);
  rpc GetFlag(GetFlagRequest) returns (GetFlagResponse);
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);
  rpc UpdateFlag(UpdateFlagRequest) returns (UpdateFlagResponse);
  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse);

  // Flag state
  rpc EnableFlag(EnableFlagRequest) returns (EnableFlagResponse);
  rpc DisableFlag(DisableFlagRequest) returns (DisableFlagResponse);

  // Rules
  rpc AddRule(AddRuleRequest) returns (AddRuleResponse);
  rpc RemoveRule(RemoveRuleRequest) returns (RemoveRuleResponse);

  // Overrides
  rpc SetOverride(SetOverrideRequest) returns (SetOverrideResponse);
  rpc RemoveOverride(RemoveOverrideRequest) returns (RemoveOverrideResponse);

  // Evaluation
  rpc EvaluateFlag(EvaluateFlagRequest) returns (EvaluateFlagResponse);
  rpc EvaluateFlags(EvaluateFlagsRequest) returns (EvaluateFlagsResponse);
}