syntax = "proto3";

package nexus.common.v1;

option go_package = "github.com/0xsj/nexus-go/gen/proto/v1/common;commonpb";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Pagination
// ============================================================================

// PageRequest represents pagination parameters for list requests.
message PageRequest {
  // Number of items per page (default: 20, max: 100).
  int32 page_size = 1;

  // Page token for cursor-based pagination.
  // Use the next_page_token from the previous response.
  string page_token = 2;
}

// PageResponse contains pagination metadata for list responses.
message PageResponse {
  // Token to retrieve the next page.
  // Empty if no more pages.
  string next_page_token = 1;

  // Total number of items (optional, may not always be provided).
  int32 total_count = 2;

  // Whether there are more pages available.
  bool has_more = 3;
}

// ============================================================================
// Sorting
// ============================================================================

// SortOrder specifies the sort direction.
enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

// SortField specifies a field to sort by.
message SortField {
  // Field name to sort by.
  string field = 1;

  // Sort direction.
  SortOrder order = 2;
}

// ============================================================================
// Timestamps
// ============================================================================

// TimeRange represents a time range for filtering.
message TimeRange {
  // Start of the time range (inclusive).
  google.protobuf.Timestamp start = 1;

  // End of the time range (exclusive).
  google.protobuf.Timestamp end = 2;
}

// AuditInfo contains standard audit fields.
message AuditInfo {
  // When the resource was created.
  google.protobuf.Timestamp created_at = 1;

  // When the resource was last updated.
  google.protobuf.Timestamp updated_at = 2;

  // Who created the resource.
  string created_by = 3;

  // Who last updated the resource.
  string updated_by = 4;
}

// ============================================================================
// Error Details
// ============================================================================

// ErrorDetail provides additional error information.
message ErrorDetail {
  // Error code (e.g., "VALIDATION_ERROR", "NOT_FOUND").
  string code = 1;

  // Human-readable error message.
  string message = 2;

  // Field that caused the error (for validation errors).
  string field = 3;

  // Additional metadata.
  map<string, string> metadata = 4;
}

// ValidationError represents a field validation error.
message ValidationError {
  // Field that failed validation.
  string field = 1;

  // Validation error message.
  string message = 2;

  // Constraint that was violated (e.g., "required", "min_length").
  string constraint = 3;
}

// ============================================================================
// Common Types
// ============================================================================

// Status represents a generic status.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_PENDING = 3;
  STATUS_DELETED = 4;
}

// Metadata is a generic key-value metadata container.
message Metadata {
  map<string, string> values = 1;
}

// StringList is a wrapper for repeated strings.
message StringList {
  repeated string values = 1;
}

// ============================================================================
// Resource Identifiers
// ============================================================================

// ResourceId identifies a resource.
message ResourceId {
  // Resource type (e.g., "user", "tenant").
  string type = 1;

  // Resource ID.
  string id = 2;
}

// ============================================================================
// Operation Metadata
// ============================================================================

// OperationMetadata contains metadata about long-running operations.
message OperationMetadata {
  // Operation ID.
  string operation_id = 1;

  // Current status.
  OperationStatus status = 2;

  // Progress percentage (0-100).
  int32 progress_percent = 3;

  // Status message.
  string status_message = 4;

  // When the operation started.
  google.protobuf.Timestamp start_time = 5;

  // When the operation ended (if completed).
  google.protobuf.Timestamp end_time = 6;
}

// OperationStatus represents the status of an operation.
enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_PENDING = 1;
  OPERATION_STATUS_RUNNING = 2;
  OPERATION_STATUS_COMPLETED = 3;
  OPERATION_STATUS_FAILED = 4;
  OPERATION_STATUS_CANCELLED = 5;
}