# Air configuration for live reloading
# https://github.com/cosmtrek/air

root = "."
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/api ./cmd/api"
  
  # Binary to run
  bin = "./tmp/api"
  
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  
  # Exclude directories
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "testdata"]
  
  # Exclude files
  exclude_file = []
  
  # Exclude regex patterns
  exclude_regex = ["_test.go"]
  
  # Exclude unchanged files
  exclude_unchanged = false
  
  # Follow symlinks
  follow_symlink = false
  
  # Delay before rebuild (ms)
  delay = 1000
  
  # Stop old binary before running new one
  stop_on_error = true
  
  # Send interrupt signal before killing
  send_interrupt = true
  
  # Kill delay (ms)
  kill_delay = 500
  
  # Log build time
  log = "build-errors.log"

[log]
  # Show log time
  time = false

[color]
  # Customize colors
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  # Keep scroll position
  clear_on_rebuild = true